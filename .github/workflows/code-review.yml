name: Automated Code Review & Quality Gate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-and-lint:
    name: Static Analysis, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Security & Privacy Guardrails
        id: guardrails
        run: |
          set -e
          ISSUES=""

          # 1. Ensure local.properties is never committed
          if [ -f local.properties ]; then
            ISSUES="${ISSUES}\n- **Blocked file:** \`local.properties\` must not be committed to git."
          fi

          # 2. Scan Kotlin sources for hardcoded API secrets or bearer/token strings
          if grep -rnE '(apiSecret\s*=\s*"[^"]+"|apiKey\s*=\s*"[a-zA-Z0-9]{12,}"|AIza[0-9A-Za-z_-]{35})' app/src/main/java; then
            ISSUES="${ISSUES}\n- **Security warning:** Potential hardcoded credential detected in \`app/src/main/java\`."
          fi

          # 3. Check for deprecated broad storage permissions in AndroidManifest.xml
          if grep -qE 'READ_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO' app/src/main/AndroidManifest.xml; then
            ISSUES="${ISSUES}\n- **Manifest warning:** Broad storage permissions found in \`AndroidManifest.xml\`."
          fi

          if [ -n "$ISSUES" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            printf "guardrail_notes<<EOF\n%b\nEOF\n" "$ISSUES" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "guardrail_notes=All security, keystore, and manifest privacy guardrails passed." >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit & Robolectric Tests
        id: tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        id: lint
        run: gradle :app:lintDebug --no-daemon

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Summarize Diff & Post PR Review Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const baseRef = context.payload.pull_request.base.sha;
            const headRef = context.payload.pull_request.head.sha;
            let changedFiles = [];
            try {
              changedFiles = execSync(`git diff --name-only ${baseRef} ${headRef}`)
                .toString()
                .trim()
                .split('\n')
                .filter(Boolean);
            } catch (e) {
              changedFiles = [];
            }

            const kotlinFiles = changedFiles.filter(f => f.endsWith('.kt'));
            const gradleFiles = changedFiles.filter(f => f.endsWith('.gradle.kts') || f.endsWith('.toml'));
            const manifestChanged = changedFiles.some(f => f.endsWith('AndroidManifest.xml'));

            const guardrailStatus = '${{ steps.guardrails.outcome }}' === 'success' ? 'Passed' : 'Failed';
            const testStatus = '${{ steps.tests.outcome }}' === 'success' ? 'Passed' : 'Failed';
            const lintStatus = '${{ steps.lint.outcome }}' === 'success' ? 'Passed' : 'Failed';

            const body = [
              '<!-- onebook-code-review -->',
              '## Automated Android Code Review',
              '',
              '| Check | Status |',
              '| --- | --- |',
              `| Security & Privacy Guardrails | ${guardrailStatus} |`,
              `| Unit & Robolectric Tests (\`:app:testDebugUnitTest\`) | ${testStatus} |`,
              `| Android Lint (\`:app:lintDebug\`) | ${lintStatus} |`,
              '',
              '### Change Summary',
              `- **Total files changed:** ${changedFiles.length}`,
              `- **Kotlin files:** ${kotlinFiles.length}`,
              `- **Gradle / Dependencies:** ${gradleFiles.length}`,
              `- **AndroidManifest modified:** ${manifestChanged ? 'Yes (verify permissions & foregroundServiceType)' : 'No'}`,
              '',
              '> Artifacts (`lint-results-debug.html` & JUnit XML) are attached to this workflow run.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes('<!-- onebook-code-review -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
